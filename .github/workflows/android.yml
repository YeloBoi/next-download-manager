name: Android companion
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING:
        required: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle -p apps/android --no-daemon assembleDebug lintDebug
      - name: Sign the Android release
        if: inputs.release
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_SIGNING" || { echo "::error::Configure the ANDROID_SIGNING Actions secret."; exit 1; }
          export NDM_ANDROID_KEYSTORE="$RUNNER_TEMP/ndm-signing.p12"
          export NDM_ANDROID_KEY_ALIAS="$(jq -er '.alias' <<< "$ANDROID_SIGNING")"
          export NDM_ANDROID_KEY_PASSWORD="$(jq -er '.password' <<< "$ANDROID_SIGNING")"
          jq -er '.pkcs12' <<< "$ANDROID_SIGNING" | base64 --decode > "$NDM_ANDROID_KEYSTORE"
          trap 'rm -f "$NDM_ANDROID_KEYSTORE"' EXIT
          version="$(sed -En "s/^[[:space:]]+versionName '([^']+)'.*/\1/p" apps/android/app/build.gradle)"
          test "v$version" = "$GITHUB_REF_NAME"
          gradle -p apps/android --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p android-release
          cp apps/android/app/build/outputs/apk/release/app-release.apk "android-release/NDM-$version-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: ndm-android-release
          path: android-release/*.apk
          if-no-files-found: error
