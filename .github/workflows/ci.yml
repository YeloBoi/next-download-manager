name: Windows checks and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firefox:
    uses: ./.github/workflows/firefox.yml
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm run build
      - name: Check English and Persian interface in hosted Edge
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node scripts/Check-Interface.mjs
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check automatic Firefox registration and persistent native messages on hosted Windows
        run: cargo test -p ndm-browser-bridge --test native_connection --locked -- --ignored
      - name: Build Windows installer and portable archive
        run: ./scripts/Build-Artifacts.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-interface-previews
          path: .artifacts/preview-*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-installer-windows-x64
          path: .artifacts/*.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-portable-windows-x64
          path: .artifacts/*portable.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-chromium-extension
          path: .artifacts/*chromium.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-firefox-extension
          path: .artifacts/*firefox.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-checksums-and-notes
          path: |
            .artifacts/SHA256SUMS
            .artifacts/RELEASE_NOTES.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
