name: Browser store packages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/**'
      - 'scripts/Build-StoreExtensions.py'
      - 'scripts/Check-Firefox.py'
      - 'scripts/Check-ChromeStore.mjs'
      - '.github/workflows/extension-stores.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@v1
      - run: python -m pip install selenium==4.52.0
      - run: python scripts/Build-StoreExtensions.py
      - name: Exercise the packaged extension in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          unzip -q .artifacts/stores/*-chrome-web-store.zip -d "$RUNNER_TEMP/ndm-chrome"
          node scripts/Check-ChromeStore.mjs "$RUNNER_TEMP/ndm-chrome"
      - name: Validate the Firefox submission
        run: |
          unzip -q .artifacts/stores/*-firefox-amo.zip -d "$RUNNER_TEMP/ndm-amo"
          npx --yes web-ext@10.0.0 lint --source-dir "$RUNNER_TEMP/ndm-amo" --warnings-as-errors
      - name: Exercise the packaged extension in Firefox
        env:
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
        run: python scripts/Check-Firefox.py .artifacts/stores/*-firefox-amo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-browser-store-submissions
          path: .artifacts/stores/*.zip
          include-hidden-files: true
          if-no-files-found: error
