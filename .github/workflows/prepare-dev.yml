name: Prepare Rust source on GitHub
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo update --workspace
      - run: cargo fmt --all
      - name: Capture lockfile and formatting
        run: git diff --binary > prepared.patch
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: prepared.patch
