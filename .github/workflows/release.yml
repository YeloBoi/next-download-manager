name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets:
      ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
  firefox:
    uses: ./.github/workflows/firefox.yml
    with:
      release: true
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
  verify-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag and application versions differ.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm run build
      - name: Check English and Persian interface in hosted Edge
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node scripts/Check-Interface.mjs
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check browser registration and persistent native messages on hosted Windows
        run: cargo test -p ndm-browser-bridge --test native_connection --locked -- --ignored
      - run: ./scripts/Build-Artifacts.ps1
      - name: Check real desktop cold and connected browser downloads on hosted Windows
        run: node scripts/Check-Browser-Download.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify installed NDM downloads in Chrome, Edge and Firefox on hosted Windows
        env:
          MOZ_REMOTE_ALLOW_SYSTEM_ACCESS: '1'
        run: |
          python -m pip install selenium==4.53.0
          python scripts/Check-Installed-Extensions.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            .artifacts/*.exe
            .artifacts/*.zip
            .artifacts/preview-*.png
            .artifacts/SHA256SUMS
            .artifacts/RELEASE_NOTES.md
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: [verify-and-build, firefox, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: ndm-android-release
          path: release-files
      - uses: actions/download-artifact@v4
        if: needs.firefox.outputs.signed == 'true'
        with:
          name: ndm-firefox-signed
          path: release-files
      - run: node scripts/Release-UpdateFeeds.mjs "$GITHUB_REF_NAME" release-files
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-files
          sha256sum --check --strict SHA256SUMS
          shopt -s nullglob
          extra=(./*.apk ./*.json ./*.xpi)
          sha256sum -- "${extra[@]}" | sed 's#  \./#  #' >> SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.exe ./*.zip ./*.png "${extra[@]}" SHA256SUMS RELEASE_NOTES.md --verify-tag --draft --prerelease --title "NDM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          # GitHub excludes prereleases from Latest; the tag and notes retain alpha status.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
