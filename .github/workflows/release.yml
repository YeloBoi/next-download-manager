name: Tagged pre-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require owner approval of publication metadata
        shell: pwsh
        run: |
          if ('${{ vars.NDM_PUBLICATION_APPROVED }}' -ne 'true') { throw 'Finalize the rights holder and binary license, then set NDM_PUBLICATION_APPROVED=true.' }
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag and application versions differ.' }
          if (Select-String -Path LICENSE -Pattern 'RIGHTS_HOLDER_PENDING|DRAFT') { throw 'Finalize LICENSE before publishing.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/Build-Artifacts.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: .artifacts/*
  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-files/* --prerelease --title "NDM $RELEASE_TAG" --notes-file release-files/RELEASE_NOTES.md
