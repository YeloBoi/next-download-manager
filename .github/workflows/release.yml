name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag and application versions differ.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm run build
      - name: Check English and Persian interface in hosted Edge
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          node scripts/Check-Interface.mjs
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: ./scripts/Build-Artifacts.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            .artifacts/*.exe
            .artifacts/*.zip
            .artifacts/preview-*.png
            .artifacts/SHA256SUMS
            .artifacts/RELEASE_NOTES.md
          include-hidden-files: true
          if-no-files-found: error
  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-files
          sha256sum --check --strict SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.exe ./*.zip ./*.png SHA256SUMS RELEASE_NOTES.md --verify-tag --draft --prerelease --title "NDM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          # GitHub excludes prereleases from Latest; the tag and notes retain alpha status.
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
