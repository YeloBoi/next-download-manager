name: Bootstrap Android signing key
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: GitHub Actions secrets public key
        required: true
        type: string
      key_id:
        description: GitHub Actions secrets public key ID
        required: true
        type: string
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyNaCl==1.5.0
      - name: Encrypt new key directly to GitHub Actions secrets
        env:
          SEAL_PUBLIC_KEY: ${{ inputs.public_key }}
          SEAL_KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          umask 077
          export NDM_PASSWORD="$(openssl rand -hex 24)"
          export NDM_KEY="$RUNNER_TEMP/ndm.p12"
          trap 'rm -f -- "$NDM_KEY"' EXIT
          keytool -genkeypair -storetype PKCS12 -keystore "$NDM_KEY" -alias ndm -keyalg RSA -keysize 3072 -validity 15000 -dname 'CN=NDM Android, O=YeloBoi' -storepass:env NDM_PASSWORD
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          key = PublicKey(base64.b64decode(os.environ["SEAL_PUBLIC_KEY"], validate=True))
          payload = json.dumps({
              "alias": "ndm",
              "password": os.environ["NDM_PASSWORD"],
              "pkcs12": base64.b64encode(Path(os.environ["NDM_KEY"]).read_bytes()).decode(),
          }).encode()
          ciphertext = SealedBox(key).encrypt(payload)
          Path("encrypted-signing-secret.json").write_text(json.dumps({
              "key_id": os.environ["SEAL_KEY_ID"],
              "encrypted_value": base64.b64encode(ciphertext).decode(),
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-android-signing-secret
          path: encrypted-signing-secret.json
          retention-days: 1
