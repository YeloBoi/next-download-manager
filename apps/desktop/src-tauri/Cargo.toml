[package]
name = "ndm-desktop"
version.workspace = true
edition.workspace = true
default-run = "ndm"

[[bin]]
name = "ndm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ndm-core = { path = "../../../crates/download-core" }
ndm-queue = { path = "../../../crates/queue" }
ndm-browser-bridge = { path = "../../../crates/browser-bridge" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs = "6"
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
uuid.workspace = true
semver = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
qrcode = { version = "0.14", default-features = false }
mdns-sd = "0.22"
if-addrs = "0.15"
same-file = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Bluetooth_Rfcomm", "Devices_Radios", "Networking_Sockets", "Storage_Streams"] }

[dev-dependencies]
tempfile.workspace = true
