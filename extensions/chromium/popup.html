<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NDM</title><link rel="stylesheet" href="popup.css"></head><body>
<header><strong class="brand"><img src="icons/48.png" width="28" height="28" alt="">NDM</strong><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option></select></header>
<h1 data-i18n="title">Send to NDM</h1><p id="connection" role="status"></p>
<a id="setup-guide" href="https://github.com/YeloBoi/next-download-manager/blob/main/docs/EXTENSION.md" target="_blank" rel="noopener noreferrer" data-i18n="setupGuide">Connection help</a>
<label for="urls" data-i18n="urls">Direct URLs, one per line</label><textarea id="urls" rows="4" dir="ltr" placeholder="https://example.com/file.zip"></textarea>
<button id="extract" data-i18n="extract">Find links on this page</button><div id="links"></div>
<button id="collect" data-i18n="collect">Add to selection</button>
<div class="selection-heading"><h2 data-i18n="selection">Saved selection</h2><button id="clear" data-i18n="clear">Clear selection</button></div>
<ol id="selection"></ol>
<p id="result" role="status"></p><footer><button id="queue" data-i18n="queue">Add to queue</button><button id="now" class="primary" data-i18n="now">Download now</button></footer>
<p class="hint" data-i18n="hint">Only selected links are shared. NDM does not read your cookies or browsing history.</p><script type="module" src="popup.js"></script></body></html>
